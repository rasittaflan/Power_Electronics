<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.75"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="18" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="url(#accentGrad)"/>

  <!-- Background PWM & Inductor Current Waveform -->
  <path d="M 650 270 L 710 190 L 790 250 L 850 170 L 930 230 L 990 150 L 1070 210 L 1130 130 L 1180 180"
        fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 650 295 L 650 265 L 710 265 L 710 295 L 790 295 L 790 265 L 850 265 L 850 295 L 930 295 L 930 265 L 990 265 L 990 295 L 1070 295 L 1070 265 L 1130 265 L 1130 295"
        fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-opacity="0.4"/>

  <!-- Schematic Illustration (Right Side) -->
  <g transform="translate(770, 55)" opacity="0.92">
    <rect x="0" y="0" width="380" height="190" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <!-- Nodes & Wires -->
    <line x1="25" y1="60" x2="85" y2="60" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Inductor Coils -->
    <path d="M 85 60 Q 100 35 115 60 Q 130 35 145 60 Q 160 35 175 60 Q 190 35 205 60" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <line x1="205" y1="60" x2="265" y2="60" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Diode Symbol -->
    <polygon points="265,48 265,72 288,60" fill="#ef4444"/>
    <line x1="288" y1="46" x2="288" y2="74" stroke="#ef4444" stroke-width="3"/>
    <line x1="288" y1="60" x2="355" y2="60" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Switch Leg -->
    <line x1="230" y1="60" x2="230" y2="95" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="230" cy="60" r="4" fill="#38bdf8"/>
    <rect x="216" y="95" width="28" height="28" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="230" y="114" fill="#f59e0b" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Q1</text>
    <line x1="230" y1="123" x2="230" y2="150" stroke="#94a3b8" stroke-width="2"/>
    <!-- Output Cap Leg -->
    <line x1="320" y1="60" x2="320" y2="98" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="320" cy="60" r="4" fill="#38bdf8"/>
    <line x1="305" y1="98" x2="335" y2="98" stroke="#38bdf8" stroke-width="3"/>
    <line x1="305" y1="108" x2="335" y2="108" stroke="#38bdf8" stroke-width="3"/>
    <line x1="320" y1="108" x2="320" y2="150" stroke="#94a3b8" stroke-width="2"/>
    <!-- Ground Line -->
    <line x1="25" y1="150" x2="355" y2="150" stroke="#475569" stroke-width="2"/>
    <!-- Labels -->
    <text x="30" y="48" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">Vin</text>
    <text x="145" y="38" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">L (CCM/DCM)</text>
    <text x="330" y="48" fill="#22c55e" font-family="monospace" font-size="12" font-weight="bold">Vout</text>
    <text x="30" y="175" fill="#94a3b8" font-family="monospace" font-size="11">D = Vout / (Vin · η)   |   f_sw   |   ΔI_L   |   RHPZ</text>
  </g>

  <!-- Left Side Typography -->
  <g transform="translate(55, 68)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="335" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="16" y="18" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
      ⚡ TI SLYU036A &amp; SLYW038B ENGINEERING SUITE
    </text>

    <!-- Main Title -->
    <text x="0" y="76" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
      Power Electronics
    </text>
    <text x="0" y="114" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="700">
      16 SMPS Topologies Design &amp; Live Formula Suite
    </text>
    <text x="0" y="142" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">
      16 Anahtarlamalı Güç Kaynağı Topolojisi Tasarım ve Canlı Hesaplama Paketi
    </text>

    <!-- Feature Chips -->
    <g transform="translate(0, 172)">
      <rect x="0" y="0" width="145" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="72" y="23" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔌 16 Topologies</text>

      <rect x="158" y="0" width="155" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="235" y="23" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🧮 400 Formulas</text>

      <rect x="326" y="0" width="175" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="413" y="23" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌐 Offline HTML &amp; MathML</text>

      <rect x="514" y="0" width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="594" y="23" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📊 Excel &amp; Calc (.ods)</text>
    </g>
  </g>
</svg>
